name: preview-shots
on: { push: { branches: [preview-shots] } }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node live.mjs
      - run: |
          git config user.name a && git config user.email a@users.noreply.github.com
          git add out && git commit -qm live && git push -q
