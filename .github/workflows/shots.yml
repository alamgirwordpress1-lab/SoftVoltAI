name: preview-shots
on: { push: { branches: [preview-shots] } }
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=0bb59e9649e9711c2fc1bd649b64ca2c
          { echo "key file: $(curl -s https://www.softvoltai.com/$K.txt)"
            urls=$(curl -s https://www.softvoltai.com/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | jq -R . | jq -s -c .)
            echo "urls: $(echo $urls | jq length)"
            body=$(jq -n -c --argjson u "$urls" --arg k "$K" '{host:"www.softvoltai.com",key:$k,keyLocation:("https://www.softvoltai.com/"+$k+".txt"),urlList:$u}')
            echo "indexnow: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)"
            echo "bing: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://www.bing.com/indexnow)"
          } > res/indexnow.txt 2>&1
          git config user.name audit && git config user.email audit@users.noreply.github.com
          git add -A res && git commit -qm indexnow && git push -q
