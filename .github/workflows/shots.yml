name: preview-shots
on: { push: { branches: [preview-shots] } }
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p res/chunks
          for c in 3lbm-r_1xmrrq 1mbrxa5cb19k1 0abjl_yrkfll5; do curl -s https://www.softvoltai.com/_next/static/chunks/$c.js -o res/chunks/$c.js; done
          git config user.name audit && git config user.email audit@users.noreply.github.com
          git add res && git commit -qm chunks && git push -q
