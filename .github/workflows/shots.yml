name: preview-shots
on: { push: { branches: [preview-shots] } }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium && pip install pillow
      - run: node shot.mjs
      - run: |
          python3 -c "
          from PIL import Image; import glob,os
          os.makedirs('res/h',exist_ok=True)
          for f in glob.glob('out/*.png'):
              im=Image.open(f).convert('RGB'); w=im.width; 
              im=im.resize((min(w,720), int(im.height*min(w,720)/w)))
              im.save('res/h/'+os.path.basename(f)[:-4]+'.jpg',quality=60)
          "
          cp out/report.json res/h/
          git config user.name shots && git config user.email shots@users.noreply.github.com
          git add res && git commit -qm h && git push -q
