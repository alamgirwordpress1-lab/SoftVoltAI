name: preview-shots
on: { push: { branches: [preview-shots] } }
permissions: { contents: write }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node links.mjs
      - run: |
          git config user.name a && git config user.email a@users.noreply.github.com
          git add res && git commit -qm links && git push -q
