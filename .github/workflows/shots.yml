name: preview-shots
on: { push: { branches: [preview-shots] } }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node shot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: out }
