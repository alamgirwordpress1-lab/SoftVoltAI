name: tmp-build-test
on: { push: { branches: [https-redirect-test] } }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://www.softvoltai.com
      WP_GRAPHQL_URL: https://cms.softvoltai.com/graphql
      WP_REST_URL: https://cms.softvoltai.com/wp-json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - run: npx wrangler deploy --dry-run --outdir dist 2>&1 | tail -30
      - name: run worker and test redirect
        run: |
          (npx wrangler dev --local --port 8787 > dev.log 2>&1 &) ; sleep 25
          echo "== https page"; curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8787/
          echo "== services"; curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8787/services
          tail -20 dev.log
